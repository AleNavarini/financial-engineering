[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'financial-engineering'
version = '0.1.0'
description = 'Financial data extraction tools for LSEG Data Platform'
requires-python = '>=3.11'
dependencies = [
  'fastapi>=0.115.0',
  'lseg-data>=1.0.0',
  'python-dotenv>=1.0.0',
  'uvicorn>=0.30.0',
]

[project.scripts]
financial-engineering-api = 'financial_engineering.app:main'
financial-engineering-data = 'financial_engineering.application.use_cases.get_data.get_data_controller:main'
financial-engineering-history = 'financial_engineering.application.use_cases.get_history.get_history_controller:main'

[tool.setuptools.packages.find]
where = ['src']
